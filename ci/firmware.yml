name: Firmware

on:
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update && sudo apt-get install -y clang-format

      # firmware/vendor/* is third-party (esp32_BNO08x submodule) and
      # keeps its own style — same scope as .pre-commit-config.yaml.
      - name: clang-format check
        run: |
          find firmware -type f \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' \) \
            -not -path 'firmware/vendor/*' \
            -print0 | xargs -0 clang-format --dry-run --Werror

  build:
    name: idf.py build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # esp32_BNO08x under firmware/vendor/ is a required build
          # dependency — fetch the submodule(s) recursively.
          submodules: recursive

      - uses: espressif/esp-idf-ci-action@v1
        with:
          # Matches the version installed on the dev machine
          # (`idf.py --version`). Bump in lock-step with the local
          # toolchain so warnings/errors don't diverge between CI
          # and local builds.
          esp_idf_version: v6.0
          target: esp32s3
          path: 'firmware'
